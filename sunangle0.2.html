<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>進行方向からの太陽の角度</title>
<style>
:root{--bg:#f6f5f1;--fg:#1d2430;--mute:#5d6675;--line:#d9d6cc;--card:#fff;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161d;--fg:#e8ebf0;--mute:#9aa3b2;--line:#2a3140;--card:#1a202a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161d;--fg:#e8ebf0;--mute:#9aa3b2;--line:#2a3140;--card:#1a202a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:16px}
.sky{border-radius:20px;padding:18px 18px 20px;color:rgb(200,200,200);background:rgb(50,50,50);text-align:center}
.sky small{opacity:.92;font-size:.85rem}
#dial{width:100%;max-width:340px;height:auto;display:block;margin:6px auto 0;text-shadow:none}
.rel{font-size:clamp(1.9rem,9vw,2.6rem);font-weight:600;line-height:1.2;margin-top:6px}
.sub{font-size:.9rem;opacity:.95}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.row:first-child{margin-top:0}
input{width:8.5em;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font:inherit}
button{padding:8px 14px;border:1px solid var(--fg);border-radius:8px;background:var(--fg);color:var(--bg);font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}
summary{cursor:pointer;margin-top:12px}
#place{font-size:.85rem;color:var(--mute)}
.note{font-size:.8rem;color:var(--mute);margin-top:14px}
</style>
</head>
<body>
<main>
  <section class="sky" id="sky" aria-live="polite">
    <small id="when">現在地を取得しています…</small>
    <svg id="dial" viewBox="0 0 200 200" role="img" aria-label="進行方向を上にしたコンパス。円の中央に太陽高度、円周上に太陽の位置を表示">
      <circle cx="100" cy="100" r="78" fill="none" stroke="rgb(200,200,200)" stroke-width="2"/>
      <g id="rot"><g id="ticks" stroke="rgb(200,200,200)"></g><g id="lbl"></g>
        <line id="shd" x1="100" y1="100" x2="100" y2="100" stroke="rgb(110,110,110)" stroke-width="6" stroke-linecap="round" visibility="hidden"/><circle cx="100" cy="100" r="3.5" fill="rgb(200,200,200)"/>
        <circle id="sun" cx="100" cy="22" r="9" fill="#ef2b2b"/></g>
      <polygon points="92,3 108,3 100,19" fill="rgb(200,200,200)"/>
      <text x="100" y="88" text-anchor="middle" font-size="9" fill="rgb(200,200,200)" stroke="rgb(50,50,50)" stroke-width="3" style="paint-order:stroke">太陽高度</text>
      <text id="altn" x="100" y="121" text-anchor="middle" font-size="18" fill="rgb(200,200,200)" stroke="rgb(50,50,50)" stroke-width="4" style="paint-order:stroke">--</text>
    </svg>
    <div class="rel" id="rel">--</div>
    <div class="sub" id="relnote">移動を始めるとGPSから、「向きセンサーを使う」を押すとiPhoneの向きから、円が回ります。</div>
    <div class="sub" id="azinfo"></div>
    <div class="sub" id="state"></div>
  </section>

  <div class="card">
    <div class="row"><button id="cmp" type="button">向きセンサーを使う</button></div>
    <div class="row"><input id="hdin" inputmode="decimal" placeholder="向き 0〜360" aria-label="向き(度)"><button id="hdset" type="button">この向きで表示</button></div>
    <details><summary>場所を手入力する</summary>
      <div class="row"><input id="lat" inputmode="decimal" placeholder="緯度 35.68" aria-label="緯度"><input id="lon" inputmode="decimal" placeholder="経度 139.77" aria-label="経度"><button id="set" type="button">この場所で計算</button></div>
    </details>
    <div style="margin-top:10px" id="place"></div>
    <div id="gps" style="font-size:.85rem;color:var(--mute)">GPS: 待機中</div>
  </div>
  <p class="note">上が進行方向です(向きセンサー使用時はiPhoneの上端の向き、未使用時はGPSの移動方向。GPSは時速3.6km以上で動いているときに更新されます)。円は北が動くように回り、太陽の点が上からどれだけ右か左かが角度になります。中央の棒の影は太陽と反対側にのび、長いほど太陽が低く、短いほど高いことを表します。天文計算(簡易式)による理論値で、大気の屈折や地形・建物は含みません。</p>
</main>
<script>
const R=Math.PI/180,$=id=>document.getElementById(id),NS="http://www.w3.org/2000/svg";
let pos=null,head=null,headT=0,manualPos=false,oriOn=false,lastR=0,sensorMsg="";
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e}
function sun(date,lat,lon){
  const jd=date.getTime()/864e5+2440587.5,n=jd-2451545;
  const L=(280.46+0.9856474*n)%360,g=((357.528+0.9856003*n)%360)*R;
  const lam=(L+1.915*Math.sin(g)+0.02*Math.sin(2*g))*R,eps=(23.439-4e-7*n)*R;
  const ra=Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam));
  const dec=Math.asin(Math.sin(eps)*Math.sin(lam));
  const gmst=((18.697374558+24.06570982441908*n)%24)*15;
  const ha=((gmst+lon)*R-ra),la=lat*R;
  const alt=Math.asin(Math.sin(la)*Math.sin(dec)+Math.cos(la)*Math.cos(dec)*Math.cos(ha));
  let az=Math.atan2(Math.sin(ha),Math.cos(ha)*Math.sin(la)-Math.tan(dec)*Math.cos(la))/R+180;
  return{alt:alt/R,az:((az%360)+360)%360};
}
const dirs=["北","北北東","北東","東北東","東","東南東","南東","南南東","南","南南西","南西","西南西","西","西北西","北西","北北西"];
function sky(a){
  if(a<-12)return["#0b1230","#1b2550"];
  if(a<-6)return["#1b2550","#4a3b7a"];
  if(a<0)return["#3c3f87","#c9774f"];
  if(a<10)return["#d9764d","#e0a85a"];
  if(a<30)return["#2f7fc4","#7fbde6"];
  return["#1f78d1","#5aa9e0"];
}
function label(a){
  if(a<-18)return"夜";
  if(a<-12)return"天文薄明";
  if(a<-6)return"航海薄明";
  if(a<0)return"市民薄明(日の出・日の入り前後)";
  if(a<10)return"太陽が低い時間帯";
  if(a<50)return"昼間";
  return"太陽が高い時間帯";
}
// ダイヤルの目盛りと方位ラベル
const tk=$("ticks"),lb=$("lbl"),labels=[];
for(let d=0;d<360;d+=10){
  const a=d*R,m=d%90===0?12:d%30===0?8:5,w=d%30===0?1.8:1;
  el("line",{x1:100+78*Math.sin(a),y1:100-78*Math.cos(a),x2:100+(78-m)*Math.sin(a),y2:100-(78-m)*Math.cos(a),"stroke-width":w},tk);
}
[["N",0],["E",90],["S",180],["W",270]].forEach(([t,d])=>{
  const a=d*R,x=100+56*Math.sin(a),y=100-56*Math.cos(a)+5;
  const e=el("text",{x:x,y:y,"text-anchor":"middle","font-size":15,"font-weight":700,fill:"rgb(200,200,200)"},lb);
  e.textContent=t;labels.push({e,x,y});
});
function render(){
  if(!pos)return;
  const d=new Date(),s=sun(d,pos.lat,pos.lon),h=head===null?0:head;
  $("altn").textContent=s.alt.toFixed(1)+"°";
  const sh=$("shd");
  if(s.alt<=0.5)sh.setAttribute("visibility","hidden");
  else{
    const L=Math.min(78,30/Math.tan(s.alt*R)),b=(s.az+180)*R;
    sh.setAttribute("x2",(100+L*Math.sin(b)).toFixed(1));sh.setAttribute("y2",(100-L*Math.cos(b)).toFixed(1));sh.setAttribute("visibility","visible");
  }
  $("rot").setAttribute("transform","rotate("+(-h).toFixed(1)+" 100 100)");
  labels.forEach(o=>o.e.setAttribute("transform","rotate("+h.toFixed(1)+" "+o.x.toFixed(1)+" "+o.y.toFixed(1)+")"));
  const a=s.az*R,sn=$("sun");
  sn.setAttribute("cx",(100+78*Math.sin(a)).toFixed(1));sn.setAttribute("cy",(100-78*Math.cos(a)).toFixed(1));
  sn.setAttribute("opacity",s.alt<0?"0.4":"1");
  $("when").textContent=d.toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit"})+" 現在";
  $("azinfo").textContent="太陽の方位 "+dirs[Math.round(s.az/22.5)%16]+" "+s.az.toFixed(0)+"°";
  $("state").textContent=label(s.alt);
  const ok=head!==null&&(Date.now()-headT<30000);
  if(!ok){$("rel").textContent="--";$("relnote").textContent=sensorMsg||"進行方向を取得できません。移動を始めるか、「向きセンサーを使う」を押すか、向きを手入力してください(いまは北が上)。";return}
  const rel=((s.az-head+540)%360)-180,ar=Math.abs(rel),side=rel>0?"右":"左";
  const t=ar<10?"ほぼ正面":ar<80?side+"前方":ar<100?side+"真横":ar<170?side+"後方":"ほぼ真後ろ";
  $("rel").textContent=t+" "+ar.toFixed(0)+"°";
  const stale=Date.now()-headT>5000;
  $("relnote").textContent="向き "+dirs[Math.round(head/22.5)%16]+" "+head.toFixed(0)+"°"+(stale?"(直前の値)":"")+(s.alt<0?"・太陽は地平線の下":"");
}
function setPos(lat,lon,src){
  pos={lat,lon};
  $("place").textContent="緯度 "+lat.toFixed(3)+"°、経度 "+lon.toFixed(3)+"°("+src+")";
  render();
}
let oriGot=false;
function onOri(e){
  let h=null;
  if(typeof e.webkitCompassHeading==="number"&&!isNaN(e.webkitCompassHeading))h=e.webkitCompassHeading;
  else if(e.absolute&&e.alpha!=null)h=(360-e.alpha)%360;
  if(h===null)return;
  const now=Date.now();
  oriGot=true;
  if(head===null||headT===Infinity)head=h;
  else head=(head+(((h-head+540)%360)-180)*0.35+360)%360;
  headT=now;sensorMsg="";
  if(now-lastR>60){lastR=now;render()}
}
$("cmp").onclick=async()=>{
  if(oriOn)return;
  try{
    if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){
      const r=await DeviceOrientationEvent.requestPermission();
      if(r!=="granted"){sensorMsg="向きセンサーが許可されませんでした。Safariを一度完全に終了して開き直し、もう一度ボタンを押して「許可」を選んでください。確認が出ずに拒否される場合は、この表示方式ではセンサーが遮られています。";render();return}
    }
    window.addEventListener("deviceorientationabsolute",onOri,true);
    window.addEventListener("deviceorientation",onOri,true);
    oriOn=true;oriGot=false;$("cmp").textContent="向きセンサー使用中";
    sensorMsg="センサーの値を待っています。端末を少し動かしてください。";render();
    setTimeout(()=>{if(!oriGot){oriOn=false;sensorMsg="向きの値が届きません。Claudeの表示枠の外(通常のURL)で開いて試してください。向きの手入力、またはGPSの進行方向は使えます。";$("cmp").textContent="向きセンサーを使う";render()}},3000);
  }catch(err){sensorMsg="この環境では向きセンサーを使えません。向きの手入力、またはGPSの進行方向を使ってください。";render()}
};
$("hdset").onclick=()=>{
  const v=parseFloat($("hdin").value);
  if(isNaN(v))return;
  head=((v%360)+360)%360;headT=Infinity;render();
};
$("set").onclick=()=>{
  const la=parseFloat($("lat").value),lo=parseFloat($("lon").value);
  if(isNaN(la)||isNaN(lo)||Math.abs(la)>90||Math.abs(lo)>180){$("place").textContent="緯度は-90〜90、経度は-180〜180の数値で入力してください。";return}
  manualPos=true;setPos(la,lo,"手入力");
};
if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(p=>setPos(p.coords.latitude,p.coords.longitude,"現在地"),
    ()=>{setPos(35.681,139.767,"位置情報を使えないため東京駅付近で表示。手入力もできます")},{timeout:8000,maximumAge:600000});
  navigator.geolocation.watchPosition(p=>{
    const c=p.coords;
    if(!manualPos)setPos(c.latitude,c.longitude,"現在地");
    if(!oriOn&&c.heading!=null&&!isNaN(c.heading)&&c.speed!=null&&c.speed>=1){head=c.heading;headT=Date.now();render()}
    $("gps").textContent="GPS 速度 "+(c.speed==null?"取得不可":(c.speed*3.6).toFixed(1)+"km/h")+" / 方向 "+(c.heading==null||isNaN(c.heading)?"取得不可":c.heading.toFixed(0)+"°");
  },e=>{$("gps").textContent=e.code===1?"GPS: 位置情報が許可されていません":"GPS: 取得できません("+e.message+")"},{enableHighAccuracy:true,maximumAge:2000});
}else setPos(35.681,139.767,"位置情報を使えないため東京駅付近で表示。手入力もできます");
setInterval(render,1000);
</script>
</body>
</html>
