<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Signal quality by direction</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;700&display=swap">
<style>
:root{--bg:#f6f5f1;--fg:#1d2430;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161d;--fg:#e8ebf0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161d;--fg:#e8ebf0;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;color:var(--fg);font-family:"Roboto Condensed","Avenir Next Condensed","HelveticaNeue-CondensedBold","Arial Narrow",sans-serif;font-stretch:condensed;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:16px}
.sky{border-radius:20px;padding:18px 18px 20px;color:rgb(200,200,200);background:rgb(60,60,60);text-align:center}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;font-size:.85rem;font-variant-numeric:tabular-nums}
#dial{width:100%;max-width:340px;height:auto;display:block;margin:6px auto 0}
.rel{font-size:clamp(1.9rem,9vw,2.6rem);font-weight:600;line-height:1.2;margin-top:6px}
.sub{font-size:.72rem;line-height:1.25}
.sws{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:12px 22px;margin-top:14px}
.sw{display:flex;align-items:center;gap:10px;width:fit-content;font-size:.95rem;cursor:pointer;position:relative}
.sw input{position:absolute;opacity:0;width:100%;height:100%;left:0;top:0;margin:0;cursor:pointer}
.trk{width:50px;height:30px;border-radius:15px;background:rgb(0,0,0);position:relative;transition:background .2s;flex:none}
.trk::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:rgb(200,200,200);transition:transform .2s,background .2s}
.sw.on .trk{background:#ffffff}
.sw.on .trk::after{transform:translateX(20px);background:#3c3c3c}
.sw input:focus-visible+.trk{outline:3px solid #3b82f6;outline-offset:2px}
.rds{display:flex;gap:14px}
.rd{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:.95rem}
.rd input{appearance:none;-webkit-appearance:none;width:18px;height:18px;margin:0;border:2px solid rgb(200,200,200);border-radius:50%;display:inline-grid;place-content:center;background:transparent;cursor:pointer}
.rd input:checked::before{content:"";width:8px;height:8px;border-radius:50%;background:rgb(255,255,255)}
.rd input:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}
.btn{padding:8px 22px;border:1px solid rgb(200,200,200);border-radius:20px;background:transparent;color:rgb(200,200,200);font:inherit;font-size:.95rem;cursor:pointer;width:fit-content}
.btn:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}
.go{font-size:1.2rem;padding:10px 38px;margin:8px 0 4px}
.rd input[value="0"]{border-color:rgb(255,200,0)}
.rd input[value="0"]:checked::before{background:rgb(255,200,0)}
.rd input[value="1"]{border-color:rgb(0,150,255)}
.rd input[value="1"]:checked::before{background:rgb(0,150,255)}
.topl{text-align:left;flex:1;min-width:0}
.topl .sub{margin-top:4px}
</style>
</head>
<body>
<main>
  <section class="sky" aria-live="polite">
    <div class="top"><div class="topl"><div class="rds" role="radiogroup" aria-label="Connection to measure"><label class="rd"><input type="radio" name="mode" value="0" checked>Cellular</label><label class="rd"><input type="radio" name="mode" value="1">Wi‑Fi</label></div><div class="sub" id="hint"></div></div><label class="sw on" id="sw"><input id="cmp" type="checkbox" role="switch" aria-label="Compass sensor" checked><span class="trk"></span><span>Compass</span></label></div>
    <svg id="dial" viewBox="0 0 200 200" role="img" aria-label="Compass dial. Wedges show connection quality in each direction; the top is where the phone points">
      <circle cx="100" cy="100" r="78" fill="rgb(200,200,200)" stroke="rgb(200,200,200)" stroke-width="2"/>
      <g id="rot"><g id="wedges"></g><g fill="none" stroke="rgb(100,100,100)" stroke-width="0.5" aria-hidden="true"><circle cx="100" cy="100" r="52"/><circle cx="100" cy="100" r="26"/></g><g id="ticks" stroke="rgb(50,50,50)"></g><g id="lbl"></g></g>
      <path d="M100 100 L79.8 24.7 A78 78 0 0 1 120.2 24.7 Z" fill="none" stroke="rgb(0,0,0)" stroke-width="0.75"/>
      <polygon points="92,3 108,3 100,19" fill="rgb(200,200,200)"/>
      <circle cx="100" cy="100" r="27" fill="rgb(60,60,60)"/>
      <text x="100" y="92" text-anchor="middle" font-size="7" fill="rgb(255,255,255)">Speed (Mbps)</text>
      <text id="ms" x="100" y="110" text-anchor="middle" font-size="16" fill="rgb(255,255,255)">--</text>
    </svg>
    <button class="btn go" id="go" type="button">Start</button>
    <div class="sub" id="note">Tap anywhere to allow the compass.</div>
    <div class="sub" id="bw"></div>
    <div class="sub">Rough download speed of a test file, not signal strength.</div>
  </section>
</main>
<script>
const R=Math.PI/180,$=id=>document.getElementById(id),NS="http://www.w3.org/2000/svg";
const NAMES=["N","NNE","ENE","E","ESE","SSE","S","SSW","WSW","W","WNW","NNW"],BASE=location.href.split("#")[0].split("?")[0];
let head=null,oriOn=false,oriGot=false,lastR=0,sensorMsg="",mode=0,lat=null,lastQ=null,running=false,runId=0;
const store=[0,1].map(()=>Array.from({length:12},()=>({q:null,v:0})));
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e}
const tk=$("ticks"),lb=$("lbl"),wd=$("wedges"),labels=[],paths=[];
for(let k=0;k<12;k++)paths.push(el("path",{fill:"rgb(255,200,0)"},wd));
for(let d=0;d<360;d+=10){
  const a=d*R,m=d%90===0?12:d%30===0?8:5,w=d%30===0?1.8:0.5;
  el("line",{x1:100+78*Math.sin(a),y1:100-78*Math.cos(a),x2:100+(78-m)*Math.sin(a),y2:100-(78-m)*Math.cos(a),"stroke-width":w},tk);
}
[["N",0],["E",90],["S",180],["W",270]].forEach(([t,d])=>{
  const a=d*R,x=100+56*Math.sin(a),y=100-56*Math.cos(a)+5;
  const e=el("text",{x:x,y:y,"text-anchor":"middle","font-size":15,"font-weight":700,fill:"rgb(50,50,50)"},lb);
  e.textContent=t;labels.push({e,x,y});
});
function wedge(k,q){
  const r=78*Math.max(q,0.03),a1=(k*30-15)*R,a2=(k*30+15)*R;
  return"M100 100 L"+(100+r*Math.sin(a1)).toFixed(1)+" "+(100-r*Math.cos(a1)).toFixed(1)+" A"+r.toFixed(1)+" "+r.toFixed(1)+" 0 0 1 "+(100+r*Math.sin(a2)).toFixed(1)+" "+(100-r*Math.cos(a2)).toFixed(1)+" Z";
}
function qlabel(q){return q>=.8?"Excellent":q>=.6?"Good":q>=.4?"Fair":q>.05?"Poor":"No response"}
function render(){
  const h=head===null?0:head,S=store[mode];
  $("rot").setAttribute("transform","rotate("+(-h).toFixed(1)+" 100 100)");
  labels.forEach(o=>o.e.setAttribute("transform","rotate("+h.toFixed(1)+" "+o.x.toFixed(1)+" "+o.y.toFixed(1)+")"));
  const ct=navigator.connection&&navigator.connection.type;
  let hint=mode?"Wi‑Fi: stay connected to the network you want to test.":"Cellular: turn Wi‑Fi off in Settings first. This page can’t choose the connection.";
  if(ct==="wifi"&&!mode)hint="Warning: the phone is on Wi‑Fi, so this measures Wi‑Fi, not cellular.";
  if(ct==="cellular"&&mode)hint="Warning: the phone is on cellular, so this measures cellular, not Wi‑Fi.";
  const hk=mode+hint,he=$("hint");
  if(he.dataset.k!==hk){
    const i=hint.indexOf(": "),sp=document.createElement("span");
    sp.style.color=mode?"rgb(0,150,255)":"rgb(255,200,0)";sp.textContent=hint.slice(0,i+1);
    he.textContent="";he.append(sp,hint.slice(i+1));he.dataset.k=hk;
  }
  const nowT=Date.now(),maxV=Math.max(0,...S.map(c=>c.q===null?0:c.v));
  S.forEach((c,k)=>{paths[k].setAttribute("d",c.q===null?"":wedge(k,maxV>0?c.v/maxV:0));paths[k].setAttribute("fill",mode?"rgb(0,150,255)":"rgb(255,200,0)");paths[k].setAttribute("fill-opacity",c.q===null?1:Math.max(0.3,1-(nowT-(c.t||0))/10000).toFixed(2))});
  $("ms").textContent=lat===null?(lastQ===null?"--":"0.0"):lat.toFixed(1);
  
  $("note").textContent=oriOn&&head!==null?"Heading "+NAMES[Math.round(head/30)%12]+" "+head.toFixed(0)+"°":(sensorMsg||"Compass is off. Turn the switch on to map directions.");
  const m=S.map((c,k)=>({k,q:c.q})).filter(x=>x.q!==null).sort((a,b)=>b.q-a.q);
  $("bw").textContent=m.length>=2?"Best "+NAMES[m[0].k]+" "+Math.round(m[0].q*100)+" · Worst "+NAMES[m[m.length-1].k]+" "+Math.round(m[m.length-1].q*100):"Rotate slowly to map directions.";
}
async function ping(){
  const t0=performance.now();
  try{
    const c=new AbortController(),to=setTimeout(()=>c.abort(),4000);
    const r=await fetch(BASE+"?_="+Date.now(),{cache:"no-store",signal:c.signal});
    const b=await r.arrayBuffer();
    clearTimeout(to);
    return b.byteLength*8/1e6/((performance.now()-t0)/1000);
  }catch(e){return null}
}
async function loop(id){
  if(id!==runId)return;
  const mb=await ping(),q=mb===null?0:Math.max(0,Math.min(1,Math.log(mb/0.2)/Math.log(100)));
  if(id!==runId)return;
  lat=mb;lastQ=q;
  if(oriOn&&head!==null){const c=store[mode][Math.round(head/30)%12];const v=mb===null?0:mb;c.v=c.q===null?v:c.v*0.6+v*0.4;c.q=c.q===null?q:c.q*0.6+q*0.4;c.t=Date.now()}
  render();setTimeout(()=>loop(id),1500);
}
function onOri(e){
  let h=null;
  if(typeof e.webkitCompassHeading==="number"&&!isNaN(e.webkitCompassHeading))h=e.webkitCompassHeading;
  else if(e.absolute&&e.alpha!=null)h=(360-e.alpha)%360;
  if(h===null)return;
  const now=Date.now();oriGot=true;sensorMsg="";
  if(head===null)head=h;else head=(head+(((h-head+540)%360)-180)*0.35+360)%360;
  if(now-lastR>60){lastR=now;render()}
}
function sensorOff(msg){
  window.removeEventListener("deviceorientationabsolute",onOri,true);
  window.removeEventListener("deviceorientation",onOri,true);
  oriOn=false;oriGot=false;$("cmp").checked=false;$("sw").classList.remove("on");sensorMsg=msg||"";head=null;render();
}
let askingOri=false;
$("cmp").onclick=()=>{
  $("sw").classList.toggle("on",$("cmp").checked);
  if(!$("cmp").checked){sensorOff("");return}
  enableSensor();
};
async function enableSensor(){
  if(oriOn||askingOri)return;
  askingOri=true;$("cmp").checked=true;$("sw").classList.add("on");
  try{
    if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){
      const r=await DeviceOrientationEvent.requestPermission();
      if(r!=="granted"){sensorOff("Compass sensor was not allowed. Fully quit the browser, reopen the page, turn the switch on again and choose “Allow”.");return}
    }
    window.addEventListener("deviceorientationabsolute",onOri,true);
    window.addEventListener("deviceorientation",onOri,true);
    oriOn=true;oriGot=false;head=null;
    sensorMsg="Waiting for sensor values. Move the device a little.";render();
    setTimeout(()=>{if(oriOn&&!oriGot)sensorOff("No heading values received. Check that the page is opened as a normal https page.")},3000);
  }catch(err){sensorOff("The compass sensor is not available here.")}finally{askingOri=false}
}
document.querySelectorAll('input[name="mode"]').forEach(r=>{r.onchange=()=>{mode=+r.value;lat=null;lastQ=null;render()}});
$("go").onclick=()=>{
  runId++;running=!running;
  $("go").textContent=running?"Stop":"Start";
  if(running)loop(runId);
  render();
};
if(typeof DeviceOrientationEvent==="undefined")sensorOff("The compass sensor is not available here.");
else if(typeof DeviceOrientationEvent.requestPermission==="function"){
  sensorMsg="Tap anywhere to allow the compass.";
  document.addEventListener("click",e=>{if(!oriOn&&!e.target.closest("#sw"))enableSensor()},{capture:true,once:true});
}else enableSensor();
render();
setInterval(render,250);
</script>
